services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tugra
      POSTGRES_PASSWORD: tugra
      POSTGRES_DB: tugra
    ports:
      - "127.0.0.1:5433:5432"   # loopback only: default dev credentials must never listen on a LAN/public interface
    volumes:
      - tugra_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"   # loopback only (unauthenticated)
    volumes:
      - tugra_redis:/data

volumes:
  tugra_pg:
  tugra_redis:
