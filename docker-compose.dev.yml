services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tugra
      POSTGRES_PASSWORD: tugra
      POSTGRES_DB: tugra
    ports:
      - "5432:5432"
    volumes:
      - tugra_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tugra_redis:/data

volumes:
  tugra_pg:
  tugra_redis:
