# Dependabot keeps dependencies and security advisories current across every ecosystem in the repo.
# Minor/patch bumps are grouped into a single PR per ecosystem to cut review noise; majors come separately.
version: 2
updates:
  # Node workspace (pnpm) — root manifest + lockfile cover every app/package.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Go agent.
  - package-ecosystem: "gomod"
    directory: "/agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Container base images (hub, web, agent, updater).
  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions used by CI + release.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
