name: Release

# Cuts a release on a version tag: builds + pushes the four images to GHCR, then publishes a signed
# update manifest (versions.json + .sig) to the gh-pages branch. The `ci` job re-runs the FULL CI
# suite against the tagged commit and the `guard` job refuses any commit that is not an ancestor of
# origin/main, so a red or off-main commit cannot be released. NOTE: an in-workflow guard is a safety
# net, not a security boundary (the tagged commit supplies this very file) — enforce who may push
# `v*` tags / to main with repo rulesets + a protected `release` Environment for UPDATE_SIGNING_KEY.
# Images are built natively per arch (build), joined into a multi-arch index + signed (merge). A manual
# dispatch with dry_run=true runs ci/guard/build/merge under a scratch `ci-<run_id>` tag and publishes nothing.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.3 or 1.2.3-beta.1"
        required: true
      min_upgrade_from:
        description: "Optional: minimum version required to upgrade directly to this release"
        required: false
      dry_run:
        description: "Dry run: build + merge + sign under a scratch ci-<run_id> tag, then stop (no latest, no manifest, no GitHub Release)"
        type: boolean
        default: false

# Least privilege at the top: only build/merge need packages:write (GHCR push; merge alone holds the
# Sigstore id-token/attestations) and the publishing jobs declare their own contents:write. ci + guard then run with contents:read only, so test code on an
# unvetted commit never holds a token that can publish.
permissions:
  contents: read

# One release at a time per ref; never cancel a publish midway (it signs + pushes a manifest).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate 1: re-run the FULL CI suite (unit + e2e + agent) against the exact tagged commit. A tag push
  # does not match ci.yml's branch trigger, so without this a commit that is red on `main` — or never
  # CI'd at all — could still be released. openapi-breaking self-skips here (it is PR-only), which is
  # correct: there is no base branch to diff a tag against.
  ci:
    needs: guard # don't even run the suite on an off-main commit
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Gate 2: refuse to release a commit that is not on `main`. The published images and the signed
  # update manifest must only ever come from main — never an arbitrary tag, a feature branch, or a
  # workflow_dispatch from a non-main ref. ("Ancestor of main" is the exact rule: an older main commit
  # stays releasable, which a hotfix tag may legitimately want.)
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the released commit to be an ancestor of main
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$SHA" FETCH_HEAD; then
            echo "::error::$SHA is not on origin/main — releases must be cut from main." >&2
            exit 1
          fi
          echo "OK: $SHA is on origin/main."
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require the root and CLI package versions to agree
        run: node scripts/check-versions.mjs

  # Version/channel/tag derivation, done ONCE here and handed to every build and merge job (they used to
  # each re-derive it). dry_run (workflow_dispatch only) swaps the release tag for a scratch `ci-<run_id>`
  # tag and forbids `latest`; publish-manifest and github-release are skipped for a dry run below.
  meta:
    needs: [ci, guard]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      channel: ${{ steps.ver.outputs.channel }}
      dry_run: ${{ steps.tag.outputs.dry_run }}
      tag: ${{ steps.tag.outputs.tag }} # the tag the images are published under (version, or ci-<run_id>)
      latest: ${{ steps.tag.outputs.latest }} # "true" only for a real stable release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }} # the exact commit ci + guard vetted (a tag could be moved mid-run)
          persist-credentials: false
      - id: ver
        name: Derive version + channel
        env:
          REF: ${{ github.event.inputs.version || github.ref_name }}
        run: bash scripts/release-version.sh "$REF" >> "$GITHUB_OUTPUT"
      - id: tag
        name: Pick the publish tag
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
          VERSION: ${{ steps.ver.outputs.version }}
          LATEST: ${{ steps.ver.outputs.latest }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            tag="ci-$RUN_ID"; latest=false
          else
            tag="$VERSION"; latest="$LATEST"
          fi
          { echo "dry_run=$DRY_RUN"; echo "tag=$tag"; echo "latest=$latest"; } >> "$GITHUB_OUTPUT"

  # One native build per image and architecture (no QEMU): amd64 on an x64 runner, arm64 on a GitHub-hosted
  # arm64 runner. Each leg pushes its image BY DIGEST only (no tag, so nothing is publicly addressable until
  # the merge job runs) and hands the digest to `merge` as an artifact. BuildKit provenance (mode=max) and the
  # SPDX SBOM are still attached here, per architecture: each leg's pushed digest is a small OCI index holding
  # the image manifest plus its attestation manifest, which `merge` carries into the final index.
  # Only packages:write is held here; the Sigstore signing permissions (id-token, attestations) live in merge.
  build:
    needs: [meta]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push the per-arch image (by digest) to GHCR
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every image is multi-arch: the control plane (hub/web/updater) runs on amd64 or arm64 hosts
          # (Pi, Graviton, Ampere), and the agent runs on managed servers of any arch.
          - { name: hub, image: ghcr.io/simeraycom/tugra-hub, dockerfile: deploy/Dockerfile.hub, arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { name: hub, image: ghcr.io/simeraycom/tugra-hub, dockerfile: deploy/Dockerfile.hub, arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
          - { name: web, image: ghcr.io/simeraycom/tugra-web, dockerfile: deploy/Dockerfile.web, arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { name: web, image: ghcr.io/simeraycom/tugra-web, dockerfile: deploy/Dockerfile.web, arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
          - { name: updater, image: ghcr.io/simeraycom/tugra-updater, dockerfile: deploy/Dockerfile.updater, arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { name: updater, image: ghcr.io/simeraycom/tugra-updater, dockerfile: deploy/Dockerfile.updater, arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
          - { name: agent, image: ghcr.io/simeraycom/tugra-agent, dockerfile: deploy/Dockerfile.agent, arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { name: agent, image: ghcr.io/simeraycom/tugra-agent, dockerfile: deploy/Dockerfile.agent, arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }} # the exact commit ci + guard vetted (a tag could be moved mid-run)
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          # Push by digest, untagged; `merge` stitches the two arch digests into the tagged manifest list.
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # SLSA build provenance (max detail) + an SPDX SBOM, attached as OCI attestation manifests next to the
          # image (registry-stored, verifiable by digest). `merge` keeps them in the final index as
          # `unknown/unknown` entries; the agent's per-arch digest extraction there filters on platform os/arch
          # (and skips the attestation-manifest entries explicitly), so they never match it. Only non-secret
          # build-args are passed, so mode=max records nothing sensitive.
          provenance: mode=max
          sbom: true
          # hub consumes all four; agent consumes TUGRA_VERSION (via ldflags); web/updater ignore the
          # unused ones. web's NEXT_PUBLIC_API_URL is intentionally left unset → SPA resolves the hub
          # origin at runtime (window.location.origin). GEOIP_CACHE_BUST only reaches the agent's geoip
          # stage (undeclared args are ignored elsewhere): it re-downloads the DB-IP file once per release so
          # a layer cached from a failed/offline bake is never reused.
          build-args: |
            TUGRA_VERSION=${{ needs.meta.outputs.version }}
            TUGRA_CHANNEL=${{ needs.meta.outputs.channel }}
            GIT_SHA=${{ github.sha }}
            TUGRA_EDITION=community
            GEOIP_CACHE_BUST=${{ needs.meta.outputs.version }}
          # The release version stamped into the image config. The updater reads it back after a
          # digest-pinned pull and refuses an image whose label != the requested target (defeats a swapped
          # digest of an older release). The hub/agent images additionally bake TUGRA_VERSION via build-args.
          labels: |
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
          # Layer cache, one scope per image and arch (native layers are not shareable across arch). The
          # cache holds only layers produced from the repo context + the non-secret build-args above (.env and
          # .git are .dockerignored, so neither can reach a layer). A cache-service hiccup must not fail a
          # release, hence ignore-error on the write.
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }},mode=max,ignore-error=true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::build step produced no valid digest for $NAME/$ARCH: '$DIGEST'" >&2
            exit 1
          fi
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/$ARCH"
          cat "digests/$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  # One merge per image: stitch the amd64 + arm64 digests into the tagged multi-arch manifest list, check the
  # result, sign it, and hand the digests to publish-manifest under the same artifact names as before.
  merge:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # create the tagged index in GHCR (also carries the attestation referrer)
      id-token: write # mint the OIDC token for keyless Sigstore (Fulcio) signing
      attestations: write # write the signed SLSA provenance attestation to GitHub's attestation store
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: hub, image: ghcr.io/simeraycom/tugra-hub }
          - { name: web, image: ghcr.io/simeraycom/tugra-web }
          - { name: updater, image: ghcr.io/simeraycom/tugra-updater }
          - { name: agent, image: ghcr.io/simeraycom/tugra-agent }
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.name }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: index
        name: Create the manifest list
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ needs.meta.outputs.tag }}
          LATEST: ${{ needs.meta.outputs.latest }}
        run: |
          set -euo pipefail
          sources=()
          for arch in amd64 arm64; do
            d=$(tr -d '[:space:]' < "digests/$arch")
            printf '%s' "$d" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::missing/invalid $arch digest for $IMAGE: '$d'" >&2; exit 1; }
            sources+=("$IMAGE@$d")
          done
          # Same tags as the single-job build pushed: the version (or the dry-run scratch tag), plus `latest`
          # for a stable release only.
          tags=(-t "$IMAGE:$TAG")
          if [ "$LATEST" = "true" ]; then tags+=(-t "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' > index.json
          digest=$(jq -r '.digest // empty' index.json)
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::no valid index digest for $IMAGE: '$digest'" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$TAG -> $digest"
      # Fail closed unless the index has exactly what the single-job build produced: the linux/amd64 and
      # linux/arm64 image manifests plus ONE BuildKit attestation manifest (provenance + SBOM) for each of
      # them, each pointing at its image through vnd.docker.reference.digest. A merge that silently dropped
      # an arch or its attestations must not be signed or published.
      - name: Verify index shape (arches + per-arch attestations)
        run: |
          set -euo pipefail
          # index.json is the descriptor-less manifest body: .manifests[] are the index entries.
          jq -e '
            def isatt: ((.annotations["vnd.docker.reference.type"] // "") == "attestation-manifest");
            [.manifests[] | select(isatt | not)] as $imgs
            | [.manifests[] | select(isatt)] as $atts
            | (($imgs | map(.platform.os + "/" + .platform.architecture) | sort) == ["linux/amd64", "linux/arm64"])
              and ($atts | length) == 2
              and ($atts | all(.annotations["vnd.docker.reference.digest"] as $d | $imgs | any(.digest == $d)))
          ' index.json >/dev/null || { echo "::error::index for ${{ matrix.image }} lacks both arches with their attestation manifests" >&2; jq . index.json >&2; exit 1; }
      # Sigstore-signed, Rekor-logged SLSA provenance (the deferred "Option B"). This COMPLEMENTS the
      # unsigned BuildKit provenance/SBOM above: it adds a keyless-signed (Fulcio cert) attestation, stored
      # in GitHub's attestation store AND as an OCI referrer on the image (push-to-registry). Runs once per
      # image → all four GHCR images. Publicly verifiable:
      #   gh attestation verify oci://ghcr.io/simeraycom/tugra-<name>:<version> --repo SimerayCom/tugra
      # subject-digest is the pushed INDEX digest, so the attestation is a referrer (not an index
      # .manifests[] entry) and the agent per-arch digest capture below is unaffected. Fails closed.
      - name: Attest build provenance (Sigstore-signed)
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - name: Capture agent per-arch digests
        if: matrix.name == 'agent'
        run: |
          jq '{
              amd64: (.manifests[] | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest" and .platform.os=="linux" and .platform.architecture=="amd64") | .digest),
              arm64: (.manifests[] | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest" and .platform.os=="linux" and .platform.architecture=="arm64") | .digest)
            }' index.json > agent-digests.json
          cat agent-digests.json
      - uses: actions/upload-artifact@v4
        if: matrix.name == 'agent'
        with:
          name: agent-digests
          path: agent-digests.json
      # The pushed INDEX digest of THIS image (the same value the attest step above uses as its subject).
      # Each matrix leg hands its digest over as its own artifact (image-digest-<name>), exactly like
      # agent-digests. publish-manifest records all four in versions.json (imageDigests) so the updater can
      # pull hub/web by digest. The value is passed through env (never interpolated into the script) and must
      # be a well-formed sha256 — a malformed/empty digest fails the leg, so a manifest can never advertise a
      # digest the merge step did not produce.
      - name: Record image index digest
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::merge step produced no valid index digest for $NAME: '$DIGEST'" >&2
            exit 1
          fi
          printf '%s\n' "$DIGEST" > "$NAME.digest"
          cat "$NAME.digest"
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.name }}
          path: ${{ matrix.name }}.digest

  # Join point that keeps the old job id: every image is built, merged, verified and signed. publish-manifest
  # and github-release depend on this job and read the version/channel from it exactly as before.
  build-push:
    needs: [meta, merge]
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      version: ${{ needs.meta.outputs.version }}
      channel: ${{ needs.meta.outputs.channel }}
    steps:
      - run: echo "All four images built natively, merged and signed (tag ${{ needs.meta.outputs.tag }})."

  # Generate + sign versions.json and publish it (with the detached .sig) to the gh-pages branch, the
  # single stable URL the self-update chain reads. The signer self-verifies against the real consumer
  # verifier and refuses to write anything that wouldn't validate, so nothing unpublishable can ship.
  # The same push also publishes host/<version>/ — the release's compose file + installer/updater scripts with a
  # separately signed HOSTFILES manifest — which the in-app updater downloads, verifies and applies (the signed
  # versions.json commits to the manifest's sha256 as `hostFilesDigest`). One commit, so the manifest can never
  # advertise host files that are not yet published.
  publish-manifest:
    needs: build-push
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    # Serialize with the manual notice workflow (same group) so the two gh-pages manifest writers never
    # race the non-force push — a loser hard-fails instead of corrupting.
    concurrency:
      group: manifest-publish
      cancel-in-progress: false
    permissions:
      contents: write # push to gh-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }} # sign from the vetted commit, not a moved tag
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Compile the pure signer core (scripts/sign-manifest.mjs imports apps/hub-api/dist).
      - run: pnpm --filter @tugra/shared build && pnpm --filter @tugra/hub-api build
      - uses: actions/download-artifact@v4
        with:
          name: agent-digests
          path: digests
      # One artifact per matrix leg (hub/web/updater/agent .digest files) holding that image's INDEX digest.
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - name: Sign the merged manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.build-push.outputs.version }}
          CHANNEL: ${{ needs.build-push.outputs.channel }}
          MIN_UPGRADE_FROM: ${{ github.event.inputs.min_upgrade_from }}
        run: |
          set -euo pipefail
          # Merge base = the CURRENTLY published manifest read straight from the gh-pages branch (the
          # trust root is repo write access — no unauthenticated HTTP fetch). Missing = first release.
          git fetch origin gh-pages --depth 1 2>/dev/null || true
          if git show origin/gh-pages:versions.json > current.json 2>/dev/null; then
            current_arg="--current current.json"
          else
            current_arg=""
          fi
          # Per-image INDEX digests (set -e: a missing/empty file aborts the publish). The signer additionally
          # validates 64-hex and, with --require-digests, refuses a release without the hub + web digests.
          read_digest() { [ -s "digests/$1.digest" ] || { echo "::error::missing digest file for $1" >&2; return 1; }; tr -d '[:space:]' < "digests/$1.digest"; }
          hub_digest=$(read_digest hub)
          web_digest=$(read_digest web)
          updater_digest=$(read_digest updater)
          agent_index_digest=$(read_digest agent)
          amd64=$(jq -r '.amd64 // empty' digests/agent-digests.json)
          arm64=$(jq -r '.arm64 // empty' digests/agent-digests.json)
          # Sign the compose + scripts of THIS (vetted) commit into out/host/<version>/ and capture the digest of the
          # signed HOSTFILES manifest (last stdout line). The grep fails the step (set -e) if it is missing.
          host_out=$(node scripts/sign-host-files.mjs --version "$VERSION" --out-dir out)
          printf '%s\n' "$host_out"
          host_digest=$(printf '%s\n' "$host_out" | sed -n 's/^host-files-digest=\([0-9a-f]\{64\}\)$/\1/p' | tail -n1)
          [ -n "$host_digest" ] || { echo "::error::sign-host-files produced no digest" >&2; exit 1; }
          node scripts/sign-manifest.mjs \
            --version "$VERSION" --channel "$CHANNEL" \
            --hub-image "ghcr.io/simeraycom/tugra-hub:$VERSION" \
            --web-image "ghcr.io/simeraycom/tugra-web:$VERSION" \
            --hub-digest "$hub_digest" --web-digest "$web_digest" \
            --updater-digest "$updater_digest" --agent-index-digest "$agent_index_digest" \
            --require-digests true \
            --host-files-digest "$host_digest" --require-host-files true \
            ${amd64:+--agent-amd64 "$amd64"} ${arm64:+--agent-arm64 "$arm64"} \
            --changelog-url "https://github.com/SimerayCom/tugra/releases/tag/v$VERSION" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            ${MIN_UPGRADE_FROM:+--min-upgrade-from "$MIN_UPGRADE_FROM"} \
            $current_arg \
            --out-dir out
      - name: Publish to gh-pages
        env:
          VERSION: ${{ needs.build-push.outputs.version }}
          CHANNEL: ${{ needs.build-push.outputs.channel }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stash the signed output, then switch the working copy to gh-pages (the build already produced
          # everything we need above, so the main tree is no longer required).
          tmp="$(mktemp -d)"; cp out/versions.json out/versions.json.sig "$tmp/"; cp -R out/host "$tmp/host"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth 1
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp "$tmp/versions.json" "$tmp/versions.json.sig" .
          # host/<version>/ is immutable once published: a re-run of the same version must reproduce it byte for byte.
          mkdir -p host
          if [ -e "host/$VERSION" ] && ! diff -r "$tmp/host/$VERSION" "host/$VERSION" >/dev/null; then
            echo "::error::host/$VERSION is already published with different content — refusing to overwrite a released version" >&2
            exit 1
          fi
          rm -rf "host/$VERSION"; cp -R "$tmp/host/$VERSION" "host/$VERSION"
          touch .nojekyll # serve every file as-is (no Jekyll processing of host/<version>/)
          git add versions.json versions.json.sig host .nojekyll
          git commit -m "release: versions.json for v$VERSION ($CHANNEL)"
          git push origin gh-pages

  # Publish a GitHub Release for the tag so the manifest's changelogUrl (and the panel's "changelog"
  # link) resolve to real notes. The body is the matching CHANGELOG.md section; a version with no
  # section falls back to a generic line. Idempotent: creates the release, or updates it on re-run.
  # Runs after the manifest so a release-notes hiccup can never block the image/manifest publish.
  github-release:
    needs: [build-push, publish-manifest]
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/edit releases
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }} # release notes from the vetted commit's CHANGELOG
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-push.outputs.version }}
          CHANNEL: ${{ needs.build-push.outputs.channel }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          notes="$(mktemp)"
          if ! bash scripts/changelog-section.sh "$VERSION" > "$notes" || [ ! -s "$notes" ]; then
            printf 'Release %s\n' "$tag" > "$notes"
          fi
          if [ "$CHANNEL" = "stable" ]; then rel=(--latest); else rel=(--prerelease --latest=false); fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file "$notes" "${rel[@]}"
          else
            gh release create "$tag" --title "$tag" --notes-file "$notes" "${rel[@]}"
          fi
