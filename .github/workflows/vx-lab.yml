name: Migration lab (vx)

# The Tier A migration lab (L0-L8): the REAL Go migrator against a REAL hub, a REAL target agent and the REAL alpine
# busybox apply extractor, all on one docker host (the runner). No fixture fakes the data plane:
#   migrator -> HTTP -> hub relay -> signed WS command -> agent curl -> /etc/tugra/app-moves -> alpine apply
# A local registry:2 holds the agent image so the REAL installer line (`curl .../install/migrator.sh | sh -s -- --image ...`)
# runs. Harness and scenario scripts: scripts/lab/. Runbook and the Tier B (two real hosts) plan: docs/runbooks/migration-lab.md.
#
# The fleet-shaped items (fleetpg, fleetdb, fleetminio, fleethosts, fleetcoolify, ubuntu) model the real estate the guided migration
# has to move: running uuid-named sources, a multi-GB time-series PostgreSQL, a MariaDB over the logical cap, a 12-bucket MinIO on a
# bind mount, Coolify 4.1.2 discovery, and an Ubuntu 26.04 userland. Their data is generated on the runner (nothing big lives in git).
#
# streamdump (L15) and pgtls (L16) are the data-plane legs the fleet's biggest databases and its TLS clients need: the streamed dump lane
# (largeDbMode stream-logical) for PostgreSQL and MariaDB with the hub killed mid-dump, and PostgreSQL with sslmode=require on 16, 17 and 18
# and pgvector. Their pass condition is data integrity, not row counts: a checksum over every column, extensions, sequences, collation, and
# the roles, ownership and grants the dump lanes are recorded to drop (scripts/lab/integrity.sh).
#
# Not part of CI on every push: it moves gigabytes through docker. Nightly, and on demand from the Actions tab
# (items: all, or a comma list of tar, core, restart, postgres, memory, seats, throttle, fleetpg, fleetdb, fleetminio, fleethosts,
# fleetcoolify, ubuntu, streamdump, pgtls; `fleet` selects the six fleet-shaped ones, `stream` the two data-plane legs L15 and L16).

on:
  workflow_dispatch:
    inputs:
      items:
        description: "all, fleet, or a comma list of: tar (L4), core (L0 L1a L1b), restart (L2), postgres (L6), memory (L7), seats (L8), throttle (L3 mechanics), fleetpg (L9), fleetdb (L10), fleetminio (L11), fleethosts (L12), fleetcoolify (L13), ubuntu (L14), streamdump (L15), pgtls (L16); fleet = the six fleet-shaped ones, stream = streamdump and pgtls"
        required: false
        default: all
        type: string
      pg_gib:
        description: "fleetpg: GiB of time-series data in the L9 PostgreSQL (the real one is about 31 GB; a runner has room for about 4-6)"
        required: false
        default: "4"
        type: string
      minio_div:
        description: "fleetminio: divisor of the real bucket sizes (1 = the real 8.8 GB shape, 4 = about 2.1 GiB)"
        required: false
        default: "4"
        type: string
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: vx-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Pick lab items
    runs-on: ubuntu-latest
    outputs:
      tar: ${{ steps.pick.outputs.tar }}
      core: ${{ steps.pick.outputs.core }}
      restart: ${{ steps.pick.outputs.restart }}
      postgres: ${{ steps.pick.outputs.postgres }}
      memory: ${{ steps.pick.outputs.memory }}
      seats: ${{ steps.pick.outputs.seats }}
      throttle: ${{ steps.pick.outputs.throttle }}
      fleetpg: ${{ steps.pick.outputs.fleetpg }}
      fleetdb: ${{ steps.pick.outputs.fleetdb }}
      fleetminio: ${{ steps.pick.outputs.fleetminio }}
      fleethosts: ${{ steps.pick.outputs.fleethosts }}
      fleetcoolify: ${{ steps.pick.outputs.fleetcoolify }}
      ubuntu: ${{ steps.pick.outputs.ubuntu }}
      streamdump: ${{ steps.pick.outputs.streamdump }}
      pgtls: ${{ steps.pick.outputs.pgtls }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          ITEMS: ${{ inputs.items }}
        run: |
          list=",$(printf '%s' "${ITEMS:-all}" | tr -d ' '),"
          for i in tar core restart postgres memory seats throttle fleetpg fleetdb fleetminio fleethosts fleetcoolify ubuntu streamdump pgtls; do
            fleet=false
            case "$i" in fleetpg|fleetdb|fleetminio|fleethosts|fleetcoolify|ubuntu) case "$list" in *",fleet,"*) fleet=true;; esac;; esac
            case "$i" in streamdump|pgtls) case "$list" in *",stream,"*) fleet=true;; esac;; esac
            if [ "$EVENT" != "workflow_dispatch" ] || [ "$list" = ",all," ] || [ "$fleet" = true ] || case "$list" in *",$i,"*) true;; *) false;; esac; then
              echo "$i=true" >> "$GITHUB_OUTPUT"
            else
              echo "$i=false" >> "$GITHUB_OUTPUT"
            fi
          done

  tar:
    name: L4 tar fidelity (busybox apply)
    needs: plan
    if: needs.plan.outputs.tar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Lab state directory
        run: echo "LAB_DIR=$RUNNER_TEMP/tugra-lab" >> "$GITHUB_ENV"
      - name: Harness self-test (no docker, the lab scripts' own decision logic)
        run: node --test scripts/lab/selftest.mjs
      - name: L4 - the migrator tar stream into the pinned alpine busybox tar
        run: scripts/lab/vx-tar-fidelity.sh
      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/lab-logs"
          cp -f "$LAB_DIR"/*.log "$LAB_DIR"/run.*.json "$LAB_DIR"/*.diff "$LAB_DIR"/*.fp.* "$LAB_DIR"/*.summary "$RUNNER_TEMP/lab-logs/" 2>/dev/null || true
          docker ps -a --format '{{.Names}} {{.Status}}' > "$RUNNER_TEMP/lab-logs/docker-ps.txt" 2>/dev/null || true
          docker logs lab-agent > "$RUNNER_TEMP/lab-logs/lab-agent.log" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vx-lab-tar
          path: ${{ runner.temp }}/lab-logs
          if-no-files-found: ignore
          retention-days: 14

  core:
    name: L0 dry-run, L1a stream, L1b interrupt and resume
    needs: plan
    if: needs.plan.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Lab state directory
        run: echo "LAB_DIR=$RUNNER_TEMP/tugra-lab" >> "$GITHUB_ENV"
      - name: Free disk space (the lab keeps source, staged parts and destination copies of a volume)
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bring the lab up (registry, agent image, hub, target agent)
        run: scripts/lab/up.sh
      - name: L0 dry-run inventory and disk check
        run: scripts/lab/l0-dry-run.sh
      - name: L1a stream a 2 GiB volume end to end
        run: scripts/lab/l1a-stream.sh
      - name: L1b kill -9, SIGTERM, divergence
        run: scripts/lab/l1b-resume.sh
      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/lab-logs"
          cp -f "$LAB_DIR"/*.log "$LAB_DIR"/run.*.json "$LAB_DIR"/*.diff "$LAB_DIR"/*.fp.* "$LAB_DIR"/*.summary "$RUNNER_TEMP/lab-logs/" 2>/dev/null || true
          docker ps -a --format '{{.Names}} {{.Status}}' > "$RUNNER_TEMP/lab-logs/docker-ps.txt" 2>/dev/null || true
          docker logs lab-agent > "$RUNNER_TEMP/lab-logs/lab-agent.log" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vx-lab-core
          path: ${{ runner.temp }}/lab-logs
          if-no-files-found: ignore
          retention-days: 14
      - name: Tear down
        if: always()
        run: scripts/lab/down.sh

  restart:
    name: L2 hub restart mid-part and mid-apply
    needs: plan
    if: needs.plan.outputs.restart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Lab state directory
        run: echo "LAB_DIR=$RUNNER_TEMP/tugra-lab" >> "$GITHUB_ENV"
      - name: Free disk space (the lab keeps source, staged parts and destination copies of a volume)
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bring the lab up (registry, agent image, hub, target agent)
        run: scripts/lab/up.sh
      - name: L2 hub killed mid-part and mid-apply
        run: scripts/lab/l2-hub-restart.sh
      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/lab-logs"
          cp -f "$LAB_DIR"/*.log "$LAB_DIR"/run.*.json "$LAB_DIR"/*.diff "$LAB_DIR"/*.fp.* "$LAB_DIR"/*.summary "$RUNNER_TEMP/lab-logs/" 2>/dev/null || true
          docker ps -a --format '{{.Names}} {{.Status}}' > "$RUNNER_TEMP/lab-logs/docker-ps.txt" 2>/dev/null || true
          docker logs lab-agent > "$RUNNER_TEMP/lab-logs/lab-agent.log" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vx-lab-restart
          path: ${{ runner.temp }}/lab-logs
          if-no-files-found: ignore
          retention-days: 14
      - name: Tear down
        if: always()
        run: scripts/lab/down.sh

  postgres:
    name: L6 PostgreSQL ${{ matrix.image }}
    needs: plan
    if: needs.plan.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image:
          - postgres:16-alpine
          - postgres:17-alpine
          - pgvector/pgvector:pg17
          - postgres:18-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Lab state directory
        run: echo "LAB_DIR=$RUNNER_TEMP/tugra-lab" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bring the lab up (registry, agent image, hub, target agent)
        run: scripts/lab/up.sh
      - name: L6 physical-copy gate and copy
        env:
          L6_IMAGE: ${{ matrix.image }}
        run: scripts/lab/l6-postgres.sh
      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/lab-logs"
          cp -f "$LAB_DIR"/*.log "$LAB_DIR"/run.*.json "$LAB_DIR"/*.diff "$LAB_DIR"/*.fp.* "$LAB_DIR"/*.summary "$RUNNER_TEMP/lab-logs/" 2>/dev/null || true
          docker ps -a --format '{{.Names}} {{.Status}}' > "$RUNNER_TEMP/lab-logs/docker-ps.txt" 2>/dev/null || true
          docker logs lab-agent > "$RUNNER_TEMP/lab-logs/lab-agent.log" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vx-lab-postgres-${{ strategy.job-index }}
          path: ${{ runner.temp }}/lab-logs
          if-no-files-found: ignore
          retention-days: 14
      - name: Tear down
        if: always()
        run: scripts/lab/down.sh

  memory:
    name: L7 migrator memory under the 768 MiB cap
    needs: plan
    if: needs.plan.outputs.memory == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Lab state directory
        run: echo "LAB_DIR=$RUNNER_TEMP/tugra-lab" >> "$GITHUB_ENV"
      - name: Free disk space (the lab keeps source, staged parts and destination copies of a volume)
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bring the lab up (registry, agent image, hub, target agent)
        run: scripts/lab/up.sh
      - name: L7 incompressible and zero volumes under --memory=768m
        run: scripts/lab/l7-memory.sh
      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/lab-logs"
          cp -f "$LAB_DIR"/*.log "$LAB_DIR"/run.*.json "$LAB_DIR"/*.diff "$LAB_DIR"/*.fp.* "$LAB_DIR"/*.summary "$RUNNER_TEMP/lab-logs/" 2>/dev/null || true
          docker ps -a --format '{{.Names}} {{.Status}}' > "$RUNNER_TEMP/lab-logs/docker-ps.txt" 2>/dev/null || true
          docker logs lab-agent > "$RUNNER_TEMP/lab-logs/lab-agent.log" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vx-lab-memory
          path: ${{ runner.temp }}/lab-logs
          if-no-files-found: ignore
          retention-days: 14
      - name: Tear down
        if: always()
        run: scripts/lab/down.sh

  seats:
    name: L8 relay seats, ${{ matrix.migrators }} migrators on ${{ matrix.seats }} seat(s)
    needs: plan
    if: needs.plan.outputs.seats == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - migrators: 2
            seats: 1
          - migrators: 4
            seats: 2
    steps:
      - uses: actions/checkout@v4
      - name: Lab state directory
        run: echo "LAB_DIR=$RUNNER_TEMP/tugra-lab" >> "$GITHUB_ENV"
      - name: Free disk space (the lab keeps source, staged parts and destination copies of a volume)
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bring the lab up (registry, agent image, hub, target agent)
        run: scripts/lab/up.sh
      - name: L8 concurrent migrations and an app move, one seat in the app-move pool
        env:
          L8_MIGRATORS: ${{ matrix.migrators }}
          L8_SEATS: ${{ matrix.seats }}
        run: scripts/lab/l8-relay-seats.sh
      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/lab-logs"
          cp -f "$LAB_DIR"/*.log "$LAB_DIR"/run.*.json "$LAB_DIR"/*.diff "$LAB_DIR"/*.fp.* "$LAB_DIR"/*.summary "$RUNNER_TEMP/lab-logs/" 2>/dev/null || true
          docker ps -a --format '{{.Names}} {{.Status}}' > "$RUNNER_TEMP/lab-logs/docker-ps.txt" 2>/dev/null || true
          docker logs lab-agent > "$RUNNER_TEMP/lab-logs/lab-agent.log" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vx-lab-seats-${{ strategy.job-index }}
          path: ${{ runner.temp }}/lab-logs
          if-no-files-found: ignore
          retention-days: 14
      - name: Tear down
        if: always()
        run: scripts/lab/down.sh

  throttle:
    name: L3 throttled link (mechanics)
    needs: plan
    if: needs.plan.outputs.throttle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Lab state directory
        run: echo "LAB_DIR=$RUNNER_TEMP/tugra-lab" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bring the lab up (registry, agent image, hub, target agent)
        run: scripts/lab/up.sh
      - name: L3 speedtest at 100, 25 and 10 MB/s and the 0.25 MB/s boundary
        run: scripts/lab/l3-throttle.sh
      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/lab-logs"
          cp -f "$LAB_DIR"/*.log "$LAB_DIR"/run.*.json "$LAB_DIR"/*.diff "$LAB_DIR"/*.fp.* "$LAB_DIR"/*.summary "$RUNNER_TEMP/lab-logs/" 2>/dev/null || true
          docker ps -a --format '{{.Names}} {{.Status}}' > "$RUNNER_TEMP/lab-logs/docker-ps.txt" 2>/dev/null || true
          docker logs lab-agent > "$RUNNER_TEMP/lab-logs/lab-agent.log" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vx-lab-throttle
          path: ${{ runner.temp }}/lab-logs
          if-no-files-found: ignore
          retention-days: 14
      - name: Tear down
        if: always()
        run: scripts/lab/down.sh

  fleetpg:
    name: L9 big time-series PostgreSQL ${{ matrix.image }}
    needs: plan
    if: needs.plan.outputs.fleetpg == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        image:
          - postgres:17-alpine
          - postgres:18-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Lab state directory
        run: echo "LAB_DIR=$RUNNER_TEMP/tugra-lab" >> "$GITHUB_ENV"
      - name: Free disk space (the lab keeps source, staged parts and destination copies of a volume)
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bring the lab up (registry, agent image, hub, target agent)
        run: scripts/lab/up.sh
      - name: L9 time-series PostgreSQL on a running uuid-named source, copied with --stop-source
        env:
          L9_IMAGE: ${{ matrix.image }}
          L9_GIB: ${{ inputs.pg_gib || '4' }}
        run: scripts/lab/l9-fleet-pg.sh
      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/lab-logs"
          cp -f "$LAB_DIR"/*.log "$LAB_DIR"/run.*.json "$LAB_DIR"/*.diff "$LAB_DIR"/*.fp.* "$LAB_DIR"/*.summary "$LAB_DIR"/l13.plan.*.json "$RUNNER_TEMP/lab-logs/" 2>/dev/null || true
          docker ps -a --format '{{.Names}} {{.Status}}' > "$RUNNER_TEMP/lab-logs/docker-ps.txt" 2>/dev/null || true
          docker logs lab-agent > "$RUNNER_TEMP/lab-logs/lab-agent.log" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vx-lab-fleetpg-${{ strategy.job-index }}
          path: ${{ runner.temp }}/lab-logs
          if-no-files-found: ignore
          retention-days: 14
      - name: Tear down
        if: always()
        run: scripts/lab/down.sh

  fleetdb:
    name: L10 MariaDB against the logical-dump cap
    needs: plan
    if: needs.plan.outputs.fleetdb == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Lab state directory
        run: echo "LAB_DIR=$RUNNER_TEMP/tugra-lab" >> "$GITHUB_ENV"
      - name: Free disk space (the lab keeps source, staged parts and destination copies of a volume)
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bring the lab up (registry, agent image, hub, target agent)
        run: scripts/lab/up.sh
      - name: L10 mariadb:11 under and over the 256 MiB dump cap
        run: scripts/lab/l10-fleet-mariadb.sh
      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/lab-logs"
          cp -f "$LAB_DIR"/*.log "$LAB_DIR"/run.*.json "$LAB_DIR"/*.diff "$LAB_DIR"/*.fp.* "$LAB_DIR"/*.summary "$LAB_DIR"/l13.plan.*.json "$RUNNER_TEMP/lab-logs/" 2>/dev/null || true
          docker ps -a --format '{{.Names}} {{.Status}}' > "$RUNNER_TEMP/lab-logs/docker-ps.txt" 2>/dev/null || true
          docker logs lab-agent > "$RUNNER_TEMP/lab-logs/lab-agent.log" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vx-lab-fleetdb
          path: ${{ runner.temp }}/lab-logs
          if-no-files-found: ignore
          retention-days: 14
      - name: Tear down
        if: always()
        run: scripts/lab/down.sh

  fleetminio:
    name: L11 MinIO, 12 buckets on a bind mount
    needs: plan
    if: needs.plan.outputs.fleetminio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Lab state directory
        run: echo "LAB_DIR=$RUNNER_TEMP/tugra-lab" >> "$GITHUB_ENV"
      - name: Free disk space (the lab keeps source, staged parts and destination copies of a volume)
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bring the lab up (registry, agent image, hub, target agent)
        run: scripts/lab/up.sh
      - name: L11 bind-mounted MinIO, refused by default, measured and copied with --allow-bind
        env:
          FLEET_MINIO_DIV: ${{ inputs.minio_div || '4' }}
        run: scripts/lab/l11-fleet-minio.sh
      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/lab-logs"
          cp -f "$LAB_DIR"/*.log "$LAB_DIR"/run.*.json "$LAB_DIR"/*.diff "$LAB_DIR"/*.fp.* "$LAB_DIR"/*.summary "$LAB_DIR"/l13.plan.*.json "$RUNNER_TEMP/lab-logs/" 2>/dev/null || true
          docker ps -a --format '{{.Names}} {{.Status}}' > "$RUNNER_TEMP/lab-logs/docker-ps.txt" 2>/dev/null || true
          docker logs lab-agent > "$RUNNER_TEMP/lab-logs/lab-agent.log" 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vx-lab-fleetminio
          path: ${{ runner.temp }}/lab-logs
          if-no-files-found: ignore
          retention-days: 14
      - name: Tear down
        if: always()
        run: scripts/lab/down.sh

  fleethosts:
    name: L12 fleet-shaped source hosts (running uuid-named sources)
    needs: plan
    if: needs.plan.outputs.fleethosts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Lab state directory
        run: echo "LAB_DIR=$RUNNER_TEMP/tugra-lab" >> "$GITHUB_ENV"
      - name: Free disk space (the lab keeps source, staged parts and destination copies of a volume)
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bring the lab up (registry, agent image, hub, target agent)
        run: scripts/lab/up.sh
      - name: L12 running, ambiguous, exited and crash-looping sources, redis, Meilisearch versions, orphans
        run: scripts/lab/l12-fleet-hosts.sh
      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/lab-logs"
