name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the Release workflow re-run this exact suite against the tagged commit before it publishes
  # anything (a tag push does not match the branch trigger above). See release.yml's `ci` job.
  workflow_call:

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tugra
          POSTGRES_PASSWORD: tugra
          POSTGRES_DB: tugra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tugra" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://tugra:tugra@localhost:5432/tugra?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789
      SECRETS_ENCRYPTION_KEY: ci-secrets-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @tugra/hub-api exec prisma migrate deploy
      - run: pnpm --filter @tugra/hub-api test:e2e

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # Backward-compatibility guard for the public API: fail a PR that makes a BREAKING change to the committed
  # OpenAPI contract vs the base branch. (The node job's drift-guard already proves the spec matches the code.)
  openapi-breaking:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go install github.com/oasdiff/oasdiff@latest
      - run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      # base_ref goes through env (not interpolated into the script) to avoid run-step expression injection.
      - run: git fetch origin "$BASE" --depth=1
        env:
          BASE: ${{ github.base_ref }}
      - run: scripts/openapi-breaking.sh "origin/$BASE"
        env:
          BASE: ${{ github.base_ref }}
