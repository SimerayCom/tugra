name: Bug report
description: Report a problem with Tugra
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Please fill out the sections below.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Tugra is affected?
      options:
        - Hub API (control plane)
        - Web dashboard
        - Agent (on a managed server)
        - CLI (@tugra/cli)
        - App templates / store
        - Install / upgrade
        - Docs
        - Not sure / other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tugra version
      description: From the dashboard footer or `GET /version` (e.g. v0.1.0). Put "unknown" if unsure.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS / distro, architecture (x86_64 / ARM), Docker version, single-server or cluster.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant logs or error output. This will be rendered as code, no need for backticks.
      render: shell
    validations:
      required: false
